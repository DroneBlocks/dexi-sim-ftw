services:
  ros2-dev:
    build: ./ros2-dev
    image: droneblocks/dexi-sim-ros2:latest
    entrypoint: /bin/bash
    command: >
      -c "/usr/local/bin/start-dexi-bringup.sh &
      exec /entrypoint.sh"
    ports:
      - "6080:80"
      - "9090:9090"  # Rosbridge websocket
    # CleanBrowsing Family Filter — blocks adult/proxy/VPN/phishing domains.
    # Pairs with the Firefox purge in ros2-dev/Dockerfile to keep the cloud-sim
    # VNC desktop from being a free general-purpose web terminal.
    dns:
      - 185.228.168.168
      - 185.228.169.168
    networks:
      dexi-network:
        ipv4_address: 172.20.0.2
        aliases:
          - ros2-dev
    environment:
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - RMW_FASTRTPS_USE_QOS_FROM_XML=0
    volumes:
      - ./dexi_ws:/home/ubuntu/dexi_ws
      - ./scripts:/home/ubuntu/scripts
      - ./dexi-mavsdk:/home/ubuntu/dexi-mavsdk
    stdin_open: true
    tty: true

  micro-dds-agent:
    image: microros/micro-ros-agent:humble
    network_mode: "service:px4-sitl"
    command: udp4 --port 8888
    environment:
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - RMW_FASTRTPS_USE_QOS_FROM_XML=0
    stdin_open: true
    tty: true

  px4-sitl:
    build: ./px4-gazebo-slim
    image: droneblocks/px4-gazebo-slim:1.16.0
    # Pass target IPs for MAVLink: [API IP, QGC IP]
    # Both streams now target mavlink-router (172.20.0.9). The router fans
    # out to code-server (preserving the existing MAVSDK flow), mavlink2rest
    # (browser GCS chrome), and external host ports.
    command: ["172.20.0.9", "172.20.0.9"]
    networks:
      dexi-network:
        ipv4_address: 172.20.0.4
    volumes:
      - ./dexi-mavsdk:/root/dexi-mavsdk
    depends_on:
      - mavlink-router
    stdin_open: true
    tty: true

  # mavlink-router fans the PX4 MAVLink stream out to code-server (MAVSDK),
  # mavlink2rest (browser GCS), and external host ports. See
  # mavlink-router/config/main.conf for the endpoint topology + the
  # loop-prevention rationale for separate PX4-side and client-side ports.
  mavlink-router:
    build: ./mavlink-router
    image: droneblocks/dexi-sim-mavlink-router:latest
    ports:
      - "5760:5760"            # TCP for QGC / MissionPlanner on the host
      - "14550:24550/udp"      # UDP GCS (clients on host see standard port)
      - "14540:24540/udp"      # UDP MAVSDK offboard (host standard port)
    networks:
      dexi-network:
        ipv4_address: 172.20.0.9
        aliases:
          - mavlink-router
    restart: unless-stopped
    stdin_open: true
    tty: true

  # mavlink2rest exposes REST + WebSocket on host port 8088 — the source the
  # browser GCS chrome (ReadinessStrip, useTelemetry, useMavlinkCommand)
  # consumes. Pulls from mavlink-router's dedicated 14770 endpoint to dodge
  # the sysid-loop-prevention trap.
  mavlink2rest:
    build: ./mavlink2rest
    image: droneblocks/dexi-sim-mavlink2rest:latest
    command:
      - --connect=udpout:172.20.0.9:14770
      - --server=0.0.0.0:8088
    ports:
      - "8088:8088"
    networks:
      dexi-network:
        ipv4_address: 172.20.0.10
        aliases:
          - mavlink2rest
    depends_on:
      - mavlink-router
    restart: unless-stopped
    stdin_open: true
    tty: true

  web-dashboard:
    image: droneblocks/dexi-droneblocks:0.20
    ports:
      - "80:3000"
    networks:
      dexi-network:
        ipv4_address: 172.20.0.5
        aliases:
          - web-dashboard
    environment:
      - ROSBRIDGE_URL=ws://ros2-dev:9090
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CHAT_LOG_URL=${CHAT_LOG_URL}
      # Branded-URL injection from cloud-init when running on a tunneled cloud
      # sim. Empty defaults keep local `docker compose up` working unchanged
      # (the GCS falls back to ${hostname}:port logic).
      - NUXT_PUBLIC_SIM_URL=${NUXT_PUBLIC_SIM_URL:-}
      - NUXT_PUBLIC_ROSBRIDGE_URL=${NUXT_PUBLIC_ROSBRIDGE_URL:-}
      - NUXT_PUBLIC_NODE_RED_URL=${NUXT_PUBLIC_NODE_RED_URL:-}
      - NUXT_PUBLIC_VSCODE_URL=${NUXT_PUBLIC_VSCODE_URL:-}
    depends_on:
      - ros2-dev
    stdin_open: true
    tty: true

  node-red:
    image: droneblocks/dexi-node-red:latest
    restart: unless-stopped
    ports:
      - "1880:1880"
    networks:
      dexi-network:
        ipv4_address: 172.20.0.6
        aliases:
          - node-red
    environment:
      - ROS2_WEBSOCKET_URL=ws://ros2-dev:9090
    depends_on:
      - ros2-dev
    volumes:
      - ./node-red-dexi/flows:/data
    stdin_open: true
    tty: true

  unity-sim:
    build:
      context: ./unity
      dockerfile: dexi-sim/Dockerfile
    image: droneblocks/dexi-sitl-city:latest
    ports:
      - "1337:1337"
    networks:
      dexi-network:
        ipv4_address: 172.20.0.7
        aliases:
          - unity-sim
    restart: unless-stopped
    stdin_open: true
    tty: true

  code-server:
    build: ./code-server
    image: droneblocks/dexi-code-server:latest
    ports:
      - "9999:8080"
    networks:
      dexi-network:
        ipv4_address: 172.20.0.8
        aliases:
          - code-server
    environment:
      - PASSWORD=droneblocks
    volumes:
      - ./dexi-mavsdk:/home/coder/dexi-mavsdk
      - ./dexi-mavsdk-basics:/home/coder/dexi-mavsdk-basics
      - ./dexi_ws:/home/coder/dexi_ws
    # Serve plain HTTP on the origin. TLS is terminated at the Cloudflare
    # tunnel edge for cloud sims; localhost-only for local docker (browsers
    # accept HTTP on localhost without warning). With --cert (self-signed
    # HTTPS), code-server redirects HTTP→HTTPS and Cloudflare loops it.
    command: --auth password
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  dexi-network:
    ipam:
      config:
        - subnet: 172.20.0.0/16
