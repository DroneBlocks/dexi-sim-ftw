<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXI Drone Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            z-index: 1000;
        }

        #loading-overlay.hidden {
            display: none;
        }

        .loading-text {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 300px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="loading-overlay">
            <div class="loading-text">Loading DEXI Simulator...</div>
            <div class="progress-bar">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        // Load Unity WebGL build
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/dexi-sim.loader.js";
        var config = {
            dataUrl: buildUrl + "/dexi-sim.data.gz",
            frameworkUrl: buildUrl + "/dexi-sim.framework.js.gz",
            codeUrl: buildUrl + "/dexi-sim.wasm.gz",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DroneBlocks",
            productName: "DEXI Simulator",
            productVersion: "1.0.0"
        };

        var canvas = document.querySelector("#unity-canvas");
        var loadingOverlay = document.querySelector("#loading-overlay");
        var progressBarFill = document.querySelector("#progress-bar");

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFill.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingOverlay.classList.add("hidden");
                console.log("Unity loaded successfully");
            }).catch((message) => {
                alert("Failed to load Unity: " + message);
            });
        };
        script.onerror = () => {
            alert("Failed to load Unity loader script");
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
