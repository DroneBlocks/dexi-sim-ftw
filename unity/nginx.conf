server {
    listen 1337;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Unity WebGL MIME types
    types {
        application/wasm                      wasm;
        application/javascript                js;
        application/octet-stream              data;
        application/json                      symbols.json;
        text/html                             html;
    }

    # Serve Brotli-compressed files (.br extension)
    location ~ \.br$ {
        # Add Content-Encoding header for .br files
        add_header Content-Encoding br;

        # Set correct MIME type based on original file
        types {
            application/wasm                      wasm;
            application/javascript                js;
            application/octet-stream              data;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
