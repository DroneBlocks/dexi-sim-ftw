services:
  ros2-dev:
    build: ./ros2-dev-pi
    network_mode: host
    environment:
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - RMW_FASTRTPS_USE_QOS_FROM_XML=0
    volumes:
      - ./dexi_ws:/root/dexi_ws
      - ./scripts:/root/scripts
    stdin_open: true
    tty: true

  px4-sitl:
    image: jonasvautherin/px4-gazebo-headless:1.16.0
    network_mode: host
    command: ["127.0.0.1", "127.0.0.1"]
    stdin_open: true
    tty: true

  micro-dds-agent:
    image: microros/micro-ros-agent:jazzy
    network_mode: host
    command: udp4 --port 8888
    environment:
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - RMW_FASTRTPS_USE_QOS_FROM_XML=0
    stdin_open: true
    tty: true
    depends_on:
      - px4-sitl

  web-dashboard:
    image: droneblocks/dexi-droneblocks:latest
    ports:
      - "80:80"
    networks:
      - dexi-network
    environment:
      # Connect to rosbridge on host via gateway
      - ROSBRIDGE_URL=ws://host.docker.internal:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    depends_on:
      - ros2-dev

  node-red:
    image: droneblocks/dexi-node-red:latest
    ports:
      - "1880:1880"
    networks:
      - dexi-network
    environment:
      # Connect to rosbridge on host via gateway
      - ROSBRIDGE_URL=ws://host.docker.internal:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - node-red-data:/data
    stdin_open: true
    tty: true
    depends_on:
      - ros2-dev

  unity-sim:
    image: droneblocks/dexi-sitl-city:latest
    ports:
      - "1337:1337"
    networks:
      - dexi-network
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  dexi-network:
    driver: bridge

volumes:
  node-red-data:
