# PX4 on its built-in SIH simulator instead of Gazebo: same image, same
# airframe family, no gzserver and no X server. With the camera coming from the
# three.js environment, Gazebo only provides physics, which SIH does for a
# fraction of the CPU. Experimental; see the README.
#
#   docker compose -f docker-compose.yml -f docker-compose.corridor.yml \
#                  -f docker-compose.sih.yml up -d
services:
  px4-sitl:
    entrypoint: ["/opt/px4/entrypoint-sih.sh"]
    volumes:
      - ./dexi-mavsdk:/root/dexi-mavsdk
      # SIH_ENTRYPOINT lets this override be used from a project rooted elsewhere.
      - ${SIH_ENTRYPOINT:-./px4-gazebo-slim/entrypoint-sih.sh}:/opt/px4/entrypoint-sih.sh:ro
