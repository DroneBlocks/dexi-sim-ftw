# mavlink-router config for the default dexi-sim-ftw stack
#
# Topology:
#
#   px4-sitl  (172.20.0.4)   PX4 Gazebo-Classic slim (iris).
#       │                    PX4 entrypoint takes IP_API + IP_QGC as positional
#       │                    args. We set both to 172.20.0.9 (this router) so
#       │                    PX4 streams BOTH instances to mavlink-router.
#       ▼
#   mavlink-router (172.20.0.9, this container)
#       ├─ [UDP Server] :14550   <-- PX4 GCS stream lands here     (px4_gcs)
#       ├─ [UDP Server] :14540   <-- PX4 API stream lands here     (px4_api)
#       ├─ [UDP Server] :24550   <-- external GCS clients          (gcs_udp)
#       ├─ [UDP Server] :24540   <-- external MAVSDK clients       (mavsdk_offboard)
#       ├─ [UDP Server] :14770   <-- mavlink2rest container        (mavlink2rest_feed)
#       ├─ [UDP Normal] code-server :14540  <-- preserves existing in-container MAVSDK flow
#       ├─ [UDP Normal] code-server :14550  <-- preserves existing in-container QGC-ish flow
#       └─ [TCP Server] :5760    <-- QGC / MissionPlanner
#
# Host port mapping (set in docker-compose.yml):
#   host:14550 -> container:24550
#   host:14540 -> container:24540
#   host:8088  -> mavlink2rest container (separate service)
#   host:5760  -> container:5760
#
# Why five UDP endpoints instead of two: see the long comment in
# sim-outdoor/mavlink-router/config/main.conf. The short version is
# mavlink-router's loop-prevention (Endpoint::accept_msg in src/endpoint.cpp)
# refuses to forward a sysid back through an endpoint where it learned that
# sysid from. Separate PX4-side and client-side endpoints sidestep the trap.
# mavlink2rest (sysid=255) gets its own dedicated 14770 endpoint because it
# would collide with GCS/MAVSDK clients (also sysid=255) on a shared port.
#
# The two Normal-mode endpoints to code-server preserve the existing dev UX:
# MAVSDK scripts running in code-server expect packets on udpin://0.0.0.0:14540
# and 14550. Router pushes those streams to them as if PX4 were sending direct.

[General]
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = common
# autolog (`Log = ...`) intentionally OFF: PX4 SITL doesn't stream ULog over
# MAVLink and the autolog feature spam-fills stdout with "Invalid ULog Magic"
# errors.

# ---- PX4-side endpoints (PX4 SITL sends here per its -t arg) ----

[UdpEndpoint px4_gcs]
Mode = Server
Address = 0.0.0.0
Port = 14550

[UdpEndpoint px4_api]
Mode = Server
Address = 0.0.0.0
Port = 14540

# ---- External client endpoints (clients connect here from outside) ----
# Internal 24540 / 24550 are mapped to host 14540 / 14550 in docker-compose.yml
# so users on the host see standard MAVLink ports.

[UdpEndpoint gcs_udp]
Mode = Server
Address = 0.0.0.0
Port = 24550

[UdpEndpoint mavsdk_offboard]
Mode = Server
Address = 0.0.0.0
Port = 24540

# ---- mavlink2rest feed (internal, not exposed on host) ----
# mavlink2rest connects in with `--connect=udpout:172.20.0.9:14770`.

[UdpEndpoint mavlink2rest_feed]
Mode = Server
Address = 0.0.0.0
Port = 14770

# ---- code-server forwards (preserve existing MAVSDK flow) ----
# Pushes the API + GCS streams TO code-server at its known IP. Normal mode =
# router actively sends UDP to this peer. Each Normal endpoint has its own
# learned-sysids set, so loop-prevention won't drop traffic between them.

[UdpEndpoint code_server_api]
Mode = Normal
Address = 172.20.0.8
Port = 14540

[UdpEndpoint code_server_gcs]
Mode = Normal
Address = 172.20.0.8
Port = 14550
